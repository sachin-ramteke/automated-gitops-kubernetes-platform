apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webapp
  namespace: default
  labels:
    app: gitops-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-webapp
  template:
    metadata:
      labels:
        app: gitops-webapp
    spec:
      containers:
      - name: webapp
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
          - |
            import http.server
            import socketserver
            import socket
            class Handler(http.server.SimpleHTTPRequestHandler):
                def do_GET(self):
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    host = socket.gethostname()
                    self.wfile.write(f'{{"status":"Online","pod":"{host}","version":"v1.0"}}\n'.encode())
            with socketserver.TCPServer(("", 5000), Handler) as httpd:
                httpd.serve_forever()
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-webapp-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: gitops-webapp
  ports:
  - port: 80
    targetPort: 5000
